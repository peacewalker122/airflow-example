name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.23
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest
      - run: bash scripts/check_dags.sh
