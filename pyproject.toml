[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform"
version = "0.1.0"
description = "Airflow pipelines for data ingestion, analytics, and retention"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "apache-airflow==3.1.0",
    "apache-airflow-providers-apache-kafka>=2,<3",
    "apache-airflow-providers-amazon>=9,<10",
    "apache-airflow-providers-postgres>=6,<7",
    "apache-airflow-providers-http>=5,<6",
    "apache-airflow-providers-sftp>=5,<6",
    "pyarrow>=18,<22",
    "structlog>=25.4,<25.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a configured external service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
